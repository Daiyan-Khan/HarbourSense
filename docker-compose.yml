# Runtime configuration is loaded from .env in this directory (copy .env.example to .env).
# Do not hardcode defaults here; set values in .env instead.

services:
  mongo:
    profiles:
      - local-mongo
    image: mongo:8
    container_name: harboursense-mongo-1
    ports:
      - "${MONGO_HOST_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mqtt:
    image: eclipse-mosquitto
    container_name: harboursense-mqtt-1
    ports:
      - "${MQTT_BROKER_PORT}:1883"
      - "${MQTT_WEBSOCKET_PORT}:9001"
    volumes:
      - ./mosquitto/conf:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  mongo-seed:
    build: ./port-sim
    container_name: harboursense-mongo-seed-1
    profiles:
      - seed
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    command: node initialise/seed-mongo.js

  backend:
    build: ./python-backend
    container_name: harboursense-backend-1
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./python-backend:/app
      - ./certs:/app/certs
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      mqtt:
        condition: service_started

  edge-analyzer:
    build: ./edge-analyzer
    container_name: harboursense-edge-analyzer-1
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      mqtt:
        condition: service_started

  portsim:
    build: ./port-sim
    container_name: harboursense-portsim-1
    env_file: .env
    environment:
      SIM_INSTALL_DEPENDENCIES: "true"
    depends_on:
      backend:
        condition: service_started
      mongo:
        condition: service_healthy
        required: false
      mqtt:
        condition: service_started
    volumes:
      - ./port-sim:/app
      - portsim_node_modules:/app/node_modules
    command: node port.js

  sensors:
    build: ./port-sim
    container_name: harboursense-sensors-1
    env_file: .env
    environment:
      SIM_INSTALL_DEPENDENCIES: "true"
    depends_on:
      mongo:
        condition: service_healthy
        required: false
      mqtt:
        condition: service_started
    volumes:
      - ./port-sim:/app
      - portsim_node_modules:/app/node_modules
    command: node sensors.js

  dashboard:
    build: ./dashboard/visualizer
    container_name: harboursense-dashboard-1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  mosquitto_data:
  portsim_node_modules:
