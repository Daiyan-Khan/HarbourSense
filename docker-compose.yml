# The 'version' tag is obsolete and has been removed.

services:
  # The local mongodb service has been REMOVED.

  mqtt:
    image: eclipse-mosquitto
    container_name: harboursense-mqtt-1
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
      - "${MQTT_WEBSOCKET_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/conf:/mosquitto/config
      - mosquitto_data:/mosquitto/data

  backend:
    build: ./python-backend
    container_name: harboursense-backend-1
    ports:
      - "8000:8000"
    volumes:
      - ./python-backend:/app
      - ./certs:/app/certs
    depends_on:
      - mqtt # The dependency on 'mongodb' has been removed
    environment:
      # Supply real secrets through .env; do not commit live credentials.
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017/port}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-port}
      MQTT_MODE: ${MQTT_MODE:-local}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mqtt}
      MQTT_BROKER_PORT: ${MQTT_BROKER_CONTAINER_PORT:-1883}
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:-}
      AWS_IOT_CA_PATH: ${AWS_IOT_CA_PATH:-/app/certs/AmazonRootCA1.pem}
      AWS_IOT_CERT_PATH: ${AWS_IOT_CERT_PATH:-/app/certs/device-certificate.pem.crt}
      AWS_IOT_KEY_PATH: ${AWS_IOT_KEY_PATH:-/app/certs/private.key}

  edge-analyzer:
    build: ./edge-analyzer
    container_name: harboursense-edge-analyzer-1
    depends_on:
      - mqtt
    environment:
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mqtt}
      MQTT_BROKER_PORT: ${MQTT_BROKER_CONTAINER_PORT:-1883}

  portsim:
    build: ./port-sim
    container_name: harboursense-portsim-1
    depends_on:
      - backend
      - mqtt
    volumes:
      - ./port-sim:/app
    command: node port.js
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://host.docker.internal:27017/port}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-port}
      MQTT_MODE: ${MQTT_MODE:-local}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST:-mqtt}
      MQTT_BROKER_PORT: ${MQTT_BROKER_CONTAINER_PORT:-1883}
      AWS_IOT_ENDPOINT: ${AWS_IOT_ENDPOINT:-}
      AWS_IOT_CA_PATH: ${AWS_IOT_CA_PATH:-/app/certs/AmazonRootCA1.pem}
      AWS_IOT_CERT_PATH: ${AWS_IOT_CERT_PATH:-/app/certs/device-certificate.pem.crt}
      AWS_IOT_KEY_PATH: ${AWS_IOT_KEY_PATH:-/app/certs/private.key}

  dashboard:
    build: ./dashboard/visualizer
    container_name: harboursense-dashboard-1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  # The mongo_data volume is no longer needed
  mosquitto_data:
