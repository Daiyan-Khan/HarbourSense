# Local development broker configuration for Docker Compose.
# Anonymous access is intentional only for disposable local runs.
# Do not expose this broker publicly without replacing this with auth/TLS.
allow_anonymous true

# Default MQTT listener for backend, simulator, and edge-analyzer containers.
listener 1883

# Optional WebSocket listener for local browser/client experiments.
# Remove this listener if no local client uses MQTT over WebSockets.
listener 9001
protocol websockets
